# Ohne diese Datei nimmt Dependabot den Default-Branch als Ziel, also `main`.
# Gearbeitet wird aber in `development` (Feature-Branch -> PR nach development
# -> gesammelt nach main). Die Folge waren Update-PRs gegen einen Branch, in
# den nichts direkt gemergt wird, und Lockfile-Konflikte beim naechsten
# development-nach-main-Merge.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      # Ein PR je Woche statt einer je Paket. Die bisherigen Einzel-PRs blieben
      # liegen, weil jeder fuer sich zu unwichtig war, um ihn anzusehen.
      frontend:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    # 0 schaltet die *Versions*-PRs ab, nicht die Sicherheitsupdates - die
    # laufen ueber Dependabot Security Updates und ignorieren dieses Limit.
    # Genau das ist hier gewollt: Der erste Lauf hat vier PRs erzeugt, die
    # nur Untergrenzen anheben (accelerate, setuptools, flair, transformers)
    # und keine einzige Sicherheitswarnung schliessen. #28 etwa hob
    # transformers auf >=4.57.6,<5 - korrekt unter 5, aber die vier hohen
    # Warnungen sitzen bei 5.3/5.5 und bleiben davon unberuehrt.
    #
    # Dazu kommt, dass ein Versionssprung hier nicht nebenbei passiert:
    # pyproject.toml:50-52 verlangt vor jedem einen Test gegen das venv,
    # weil torch/transformers/tokenizers die Messungen verschieben koennen.
    # Ein woechentlicher Bot-PR kann diese Pruefung nicht leisten.
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "monthly"
