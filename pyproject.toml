[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magda"
version = "0.3.0"
description = "Strukturierte Angebotsdaten aus deutschen Supermarkt-Prospekten"
requires-python = ">=3.11"

dependencies = [
    # Daten-Pipeline
    "requests",
    "pymupdf",
    "tqdm",
    "python-dotenv",
    "openai",

    # Modelltraining und Evaluation
    "torch",
    # transformers 5.x hat die Slow-Tokenizer entfernt; deepset/gbert-base
    # liefert aber nur vocab.txt und laesst sich dort nicht mehr laden.
    "transformers>=4.44,<5",
    "accelerate>=0.26",   # vom HF-Trainer vorausgesetzt, kommt nicht automatisch mit
    "sentencepiece",
    "pillow",             # Seitenbilder fuer den visuellen Backbone von LayoutXLM
    "numpy",
    "seqeval",

    # Frontend-API
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",
]

# LayoutXLM (LayoutLMv2-Architektur) braucht zusaetzlich detectron2 fuer den
# visuellen Backbone. Die Installation ist plattformabhaengig und laesst sich
# nicht als Abhaengigkeit ausdruecken, siehe docs/runpod.md.

[project.scripts]
magda = "magda.cli:main"

[project.optional-dependencies]
# Vergleichsarm mit einem fertigen deutschen NER-Modell
# (scripts/07_flair_baseline.py). Bewusst optional: flair bringt gut zwei
# Dutzend Pakete mit (boto3, gdown, langdetect, lxml ...), die fuer Pipeline
# und Training keine Rolle spielen.
#
# Geprueft am 29.07.2026 gegen das Projekt-venv: flair 0.15.1 laesst numpy,
# torch, transformers und tokenizers unangetastet. Vor einem Versionssprung
# lohnt derselbe Test:  pip install --dry-run '.[flair]'
flair = ["flair>=0.13"]
# `pulp` gehört hierher und nicht in requirements.txt: die Pipeline
# kommt ohne den ILP-Dekoder aus, die Prüfung nicht. Er trägt den
# stärksten gemessenen Gruppierungsbefund (+0.100 Gruppen-F1,
# p = 0.000) – ein Pfad, den CI nie ausführt, ist ungeprüft.
#
# `highspy` ist der Solver dahinter und kein Luxus: gemessen an einer
# echten Gitter-Instanz (93 Entities, 4278 Variablen) löst HiGHS in 96 s,
# wo PuLPs mitgeliefertes CBC nach 900 s noch nicht fertig war – bei
# identischem Zielwert. Zwei Gründe, beide unabhängig von der Qualität
# der Solver: das CBC-Binary ist x86_64 und läuft auf Apple Silicon unter
# Rosetta, und `PULP_CBC_CMD` startet je Schnittebenen-Runde einen neuen
# Prozess samt Schreiben und Lesen der Modelldatei. Fehlt highspy, fällt
# `offer_ilp._solver()` auf CBC zurück: gleiches Ergebnis, längere Läufe.
# (PuLP 3.3 verwarnt PULP_CBC_CMD ohnehin für 4.0.)
dev = ["pytest", "httpx", "pulp", "highspy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
